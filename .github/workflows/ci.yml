name: CI

on: [push, pull_request]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
      - run: cargo sqlx prepare -- --migrations-path migrations
      - run: cargo fmt -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test