[package]
name = "fsspx-website"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "macros"] }
askama = "0.13"
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
warp = "0.3"

[dev-dependencies]
cargo-watch = "8"