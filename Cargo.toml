[package]
name = "fsspx-website"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["tokio1"] }
serde = { version = "1.0", features = ["derive"] }
sqlx = { version = "0.7", features = ["runtime-tokio-native-tls", "sqlite", "macros"] }
askama = { version = "0.13", features = ["with-axum"] }
dotenvy = "0.15"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
cargo-watch = "8"